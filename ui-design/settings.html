<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>设置 - 校园交换助手</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="main-menu.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- 顶部标题栏 -->
  <div class="page-header">
    <h1 class="page-title">设置</h1>
  </div>

  <!-- 设置列表 -->
  <div class="settings-list">
    <!-- 个人信息 -->
    <div class="settings-group">
      <h3 class="group-title">个人信息</h3>
      <div class="settings-item" onclick="window.location.href='profile.html'">
        <div class="item-left">
          <i class="fas fa-user-circle item-icon"></i>
          <span class="item-text">个人资料</span>
        </div>
        <i class="fas fa-chevron-right item-arrow"></i>
      </div>
      <div class="settings-item" onclick="window.location.href='address.html'">
        <div class="item-left">
          <i class="fas fa-map-marker-alt item-icon"></i>
          <span class="item-text">地址</span>
        </div>
        <i class="fas fa-chevron-right item-arrow"></i>
      </div>
    </div>

    <!-- 账号安全 -->
    <div class="settings-group">
      <h3 class="group-title">账号安全</h3>
      <div class="settings-item" onclick="window.location.href='change-password.html'">
        <div class="item-left">
          <i class="fas fa-lock item-icon"></i>
          <span class="item-text">修改密码</span>
        </div>
        <i class="fas fa-chevron-right item-arrow"></i>
      </div>
      <div class="settings-item" onclick="window.location.href='change-phone.html'">
        <div class="item-left">
          <i class="fas fa-mobile-alt item-icon"></i>
          <span class="item-text">手机号</span>
        </div>
        <i class="fas fa-chevron-right item-arrow"></i>
      </div>
    </div>

    <!-- 其他 -->
    <div class="settings-group">
      <h3 class="group-title">其他</h3>
      <div class="settings-item">
        <div class="item-left">
          <i class="fas fa-info-circle item-icon"></i>
          <span class="item-text">关于我们</span>
        </div>
        <i class="fas fa-chevron-right item-arrow"></i>
      </div>
      <div class="settings-item">
        <div class="item-left">
          <i class="fas fa-headset item-icon"></i>
          <span class="item-text">联系客服</span>
        </div>
        <i class="fas fa-chevron-right item-arrow"></i>
      </div>
    </div>

    <!-- 退出登录 -->
    <div class="logout-section">
      <button class="btn-logout" onclick="handleLogout()">
        <i class="fas fa-sign-out-alt"></i>
        <span>退出登录</span>
      </button>
    </div>
  </div>

  <!-- 底部导航栏 -->
  <nav class="bottom-nav">
    <div class="nav-item" data-tab="mall" onclick="window.location.href='main-menu.html'">
      <i class="fas fa-home"></i>
      <span>商城</span>
      <div class="nav-indicator"></div>
    </div>
    <div class="nav-item" data-tab="selling" onclick="window.location.href='selling.html'">
      <i class="fas fa-box"></i>
      <span>在售</span>
      <div class="nav-indicator"></div>
    </div>
    <div class="nav-item" data-tab="todo" onclick="window.location.href='todo.html'">
      <i class="fas fa-list-check"></i>
      <span>待办</span>
      <div class="nav-indicator"></div>
    </div>
    <div class="nav-item active" data-tab="settings">
      <i class="fas fa-cog"></i>
      <span>设置</span>
      <div class="nav-indicator"></div>
    </div>
  </nav>

  <script src="settings.js"></script>
</body>
</html>
