<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>购物车 - 校园交换助手</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="main-menu.css">
  <link rel="stylesheet" href="cart.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <div class="page-header">
    <button class="btn-back" onclick="window.location.href='main-menu.html'">
      <i class="fas fa-arrow-left"></i>
    </button>
    <h1 class="page-title">购物车</h1>
    <div class="header-spacer"></div>
  </div>

  <!-- 购物车列表 -->
  <div class="cart-list" id="cartList">
    <!-- 购物车为空时显示 -->
    <div class="empty-cart" id="emptyCart">
      <div class="empty-icon">
        <i class="fas fa-shopping-cart"></i>
      </div>
      <h3 class="empty-title">购物车是空的</h3>
      <p class="empty-desc">快去商城选购心仪的商品吧</p>
      <button class="btn btn-primary" onclick="window.location.href='main-menu.html'">
        去逛逛
      </button>
    </div>
  </div>

  <!-- 底部结算栏 -->
  <div class="cart-footer" id="cartFooter" style="display: none;">
    <div class="select-all">
      <label class="checkbox-label">
        <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
        <span>全选</span>
      </label>
    </div>
    <div class="total-section">
      <div class="total-text">
        合计: <span class="total-price" id="totalPrice">¥0.00</span>
      </div>
      <button class="btn-checkout" onclick="checkout()">
        结算(<span id="selectedCount">0</span>)
      </button>
    </div>
  </div>

  <!-- 底部导航栏 -->
  <nav class="bottom-nav">
    <div class="nav-item" data-tab="mall" onclick="window.location.href='main-menu.html'">
      <i class="fas fa-home"></i>
      <span>商城</span>
      <div class="nav-indicator"></div>
    </div>
    <div class="nav-item" data-tab="selling" onclick="window.location.href='selling.html'">
      <i class="fas fa-box"></i>
      <span>在售</span>
      <div class="nav-indicator"></div>
    </div>
    <div class="nav-item" data-tab="todo" onclick="window.location.href='todo.html'">
      <i class="fas fa-list-check"></i>
      <span>待办</span>
      <div class="nav-indicator"></div>
    </div>
    <div class="nav-item" data-tab="settings" onclick="window.location.href='settings.html'">
      <i class="fas fa-cog"></i>
      <span>设置</span>
      <div class="nav-indicator"></div>
    </div>
  </nav>

  <script src="cart.js"></script>
</body>
</html>
