<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>在售 - 校园交换助手</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="main-menu.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="selling.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="has-header">
  <!-- 顶部标题栏 -->
  <div class="page-header">
    <h1 class="page-title">我的在售商品</h1>
    <button class="btn-add-product" onclick="showAddProductModal()">
      <i class="fas fa-plus"></i>
    </button>
  </div>

  <!-- 商品列表 -->
  <div class="product-list" id="productList">
    <!-- 空状态提示 -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <i class="fas fa-box-open"></i>
      </div>
      <h3 class="empty-title">暂无在售商品</h3>
      <p class="empty-desc">点击右上角的 + 添加您的商品</p>
    </div>
  </div>

  <!-- 添加商品弹窗 -->
  <div class="modal" id="addProductModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>添加商品</h2>
        <button class="btn-close" onclick="hideAddProductModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <form id="addProductForm">
          <!-- 商品标题 -->
          <div class="form-group">
            <label class="form-label">商品标题 <span class="required">*</span></label>
            <input type="text" class="form-input" id="productTitle" placeholder="请输入商品标题" maxlength="50">
            <span class="char-count"><span id="titleCount">0</span>/50</span>
          </div>

          <!-- 商品价格 -->
          <div class="form-group">
            <label class="form-label">价格 <span class="required">*</span></label>
            <div class="price-input-wrapper">
              <span class="price-symbol">¥</span>
              <input type="number" class="form-input price-input" id="productPrice" placeholder="0.00" step="0.01" min="0">
            </div>
          </div>

          <!-- 商品图片 -->
          <div class="form-group">
            <label class="form-label">商品图片 (最多6张) <span class="required">*</span></label>
            <div class="image-upload-area">
              <input type="file" id="productImages" multiple accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
              <div class="upload-placeholder" onclick="document.getElementById('productImages').click()">
                <i class="fas fa-camera"></i>
                <span>点击上传图片</span>
                <span class="upload-hint">支持 JPG、PNG 格式,最多6张</span>
              </div>
              <div class="image-preview" id="imagePreview"></div>
            </div>
          </div>

          <!-- 商品描述 -->
          <div class="form-group">
            <label class="form-label">商品描述 <span class="required">*</span></label>
            <textarea class="form-textarea" id="productDescription" placeholder="请详细描述商品的信息,如品牌、规格、成色、新旧程度等" maxlength="500"></textarea>
            <span class="char-count"><span id="descCount">0</span>/500</span>
          </div>

          <!-- 成色选择 -->
          <div class="form-group">
            <label class="form-label">成色 <span class="required">*</span></label>
            <div class="condition-options">
              <label class="condition-option">
                <input type="radio" name="condition" value="new" required>
                <span>全新</span>
              </label>
              <label class="condition-option">
                <input type="radio" name="condition" value="like_new">
                <span>几乎全新</span>
              </label>
              <label class="condition-option">
                <input type="radio" name="condition" value="good">
                <span>轻微使用</span>
              </label>
              <label class="condition-option">
                <input type="radio" name="condition" value="fair">
                <span>明显使用痕迹</span>
              </label>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" onclick="hideAddProductModal()">取消</button>
        <button class="btn btn-primary" onclick="submitProduct()">发布</button>
      </div>
    </div>
  </div>

  <!-- 底部导航栏 -->
  <nav class="bottom-nav">
    <div class="nav-item" data-tab="mall" onclick="window.location.href='main-menu.html'">
      <i class="fas fa-home"></i>
      <span>商城</span>
      <div class="nav-indicator"></div>
    </div>
    <div class="nav-item active" data-tab="selling">
      <i class="fas fa-box"></i>
      <span>在售</span>
      <div class="nav-indicator"></div>
    </div>
    <div class="nav-item" data-tab="todo" onclick="window.location.href='todo.html'">
      <i class="fas fa-list-check"></i>
      <span>待办</span>
      <div class="nav-indicator"></div>
    </div>
    <div class="nav-item" data-tab="settings" onclick="window.location.href='settings.html'">
      <i class="fas fa-cog"></i>
      <span>设置</span>
      <div class="nav-indicator"></div>
    </div>
  </nav>

  <script src="selling.js"></script>
</body>
</html>
