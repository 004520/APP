<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>商城 - 校园交换助手</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="main-menu.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@cloudbase/js-sdk@8.10.3/dist/cloudbase.full.js"></script>
  <script src="js/cloudbase-config.js"></script>
  <script src="js/cloudbase.js"></script>
</head>
<body class="has-search-bar">
  <!-- 顶部搜索栏 -->
  <div class="search-bar">
    <div class="search-input-wrapper">
      <i class="fas fa-search search-icon"></i>
      <input type="text" class="search-input" placeholder="搜索商品或卖家">
    </div>
    <div class="cart-icon" onclick="window.location.href='cart.html'">
      <i class="fas fa-shopping-cart"></i>
      <span class="cart-badge" id="cartBadge" style="display: none;">0</span>
    </div>
  </div>

  <!-- 分类标签 -->
  <div class="category-tabs">
    <div class="category-tab active" data-category="all">
      <span>全部</span>
      <div class="tab-indicator"></div>
    </div>
    <div class="category-tab" data-category="digital">
      <span>数码</span>
      <div class="tab-indicator"></div>
    </div>
    <div class="category-tab" data-category="books">
      <span>图书</span>
      <div class="tab-indicator"></div>
    </div>
    <div class="category-tab" data-category="daily">
      <span>日用</span>
      <div class="tab-indicator"></div>
    </div>
    <div class="category-tab" data-category="sports">
      <span>运动</span>
      <div class="tab-indicator"></div>
    </div>
  </div>

  <!-- 空状态提示 -->
  <div class="empty-state">
    <h3 class="empty-title">暂无商品</h3>
  </div>

  <!-- 底部导航栏 -->
  <nav class="bottom-nav">
    <div class="nav-item active" data-tab="mall">
      <i class="fas fa-home"></i>
      <span>商城</span>
      <div class="nav-indicator"></div>
    </div>
    <div class="nav-item" data-tab="selling" onclick="window.location.href='selling.html'">
      <i class="fas fa-box"></i>
      <span>在售</span>
      <div class="nav-indicator"></div>
    </div>
    <div class="nav-item" data-tab="todo" onclick="window.location.href='todo.html'">
      <i class="fas fa-list-check"></i>
      <span>待办</span>
      <div class="nav-indicator"></div>
      <div class="nav-badge" id="todoBadge" style="display: none;">0</div>
    </div>
    <div class="nav-item" data-tab="settings" onclick="window.location.href='settings.html'">
      <i class="fas fa-cog"></i>
      <span>设置</span>
      <div class="nav-indicator"></div>
    </div>
  </nav>

  <script src="main-menu.js"></script>
  <script>
    // 模拟待办数据，实际应该从后端获取
    const todoCount = 0; // 当前为0，所以小红点隐藏

    // 控制小红点显示
    const todoBadge = document.getElementById('todoBadge');
    if (todoCount > 0) {
      todoBadge.style.display = 'flex';
      todoBadge.textContent = todoCount > 99 ? '99+' : todoCount;
    } else {
      todoBadge.style.display = 'none';
    }
  </script>
</body>
</html>
