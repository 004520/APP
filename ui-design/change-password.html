<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>修改密码 - 校园交换助手</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="change-password.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@cloudbase/js-sdk@8.10.3/dist/cloudbase.full.js"></script>
  <script src="js/cloudbase-config.js"></script>
  <script src="js/cloudbase.js"></script>
</head>
<body>
  <!-- 顶部导航栏 -->
  <div class="page-header">
    <button class="btn-back" onclick="window.location.href='settings.html'">
      <i class="fas fa-arrow-left"></i>
    </button>
    <h1 class="page-title">修改密码</h1>
  </div>

  <!-- 修改密码表单 -->
  <div class="change-password-section">
    <form id="changePasswordForm">
      <!-- 原密码 -->
      <div class="form-item">
        <label class="form-label">原密码 <span class="required">*</span></label>
        <div class="input-wrapper">
          <input type="password" class="input" id="oldPassword" placeholder="请输入原密码" required>
          <button type="button" class="toggle-password" onclick="togglePassword('oldPassword')">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="error-msg" id="oldPasswordError"></div>
      </div>

      <!-- 新密码 -->
      <div class="form-item">
        <label class="form-label">新密码 <span class="required">*</span></label>
        <div class="input-wrapper">
          <input type="password" class="input" id="newPassword" placeholder="请输入新密码（6-20位）" required>
          <button type="button" class="toggle-password" onclick="togglePassword('newPassword')">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="error-msg" id="newPasswordError"></div>
        <div class="password-tips">
          密码长度为6-20位
        </div>
      </div>

      <!-- 确认新密码 -->
      <div class="form-item">
        <label class="form-label">确认新密码 <span class="required">*</span></label>
        <div class="input-wrapper">
          <input type="password" class="input" id="confirmPassword" placeholder="请再次输入新密码" required>
          <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="error-msg" id="confirmPasswordError"></div>
      </div>

      <!-- 提交按钮 -->
      <button type="submit" class="btn btn-primary">
        <span class="btn-text">确认修改</span>
      </button>
    </form>
  </div>

  <script src="change-password.js"></script>
</body>
</html>
