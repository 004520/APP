<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>个人资料 - 校园交换助手</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <div class="page-header">
    <button class="btn-back">
      <i class="fas fa-arrow-left"></i>
    </button>
    <h1 class="page-title">个人资料</h1>
    <button class="btn-save">保存</button>
  </div>

  <!-- 表单区域 -->
  <div class="form-section" style="margin-top: 200px !important;">
    <!-- 昵称 -->
    <div class="form-item">
      <label class="form-label">昵称</label>
      <div class="form-input-wrapper">
        <input type="text" class="form-input" id="nickname" placeholder="请输入昵称" maxlength="20" value="小猫咪">
      </div>
    </div>

    <!-- 真实姓名 -->
    <div class="form-item">
      <label class="form-label">真实姓名 <span class="required">*</span></label>
      <div class="form-input-wrapper">
        <input type="text" class="form-input" id="realName" placeholder="请输入真实姓名" maxlength="10" value="张三">
      </div>
    </div>

    <!-- 学号 -->
    <div class="form-item">
      <label class="form-label">学号 <span class="required">*</span></label>
      <div class="form-input-wrapper">
        <input type="text" class="form-input" id="studentId" placeholder="请输入学号" maxlength="12" value="20230001">
      </div>
    </div>

    <!-- 手机号 -->
    <div class="form-item">
      <label class="form-label">手机号 <span class="required">*</span></label>
      <div class="form-input-wrapper">
        <input type="tel" class="form-input" id="phone" placeholder="请输入手机号" maxlength="11" value="138****5678">
      </div>
    </div>

    <!-- 性别 -->
    <div class="form-item">
      <label class="form-label">性别</label>
      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="gender" value="male">
          <span class="radio-text">男</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="gender" value="female">
          <span class="radio-text">女</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="gender" value="secret">
          <span class="radio-text">保密</span>
        </label>
      </div>
    </div>

    <!-- 学院 -->
    <div class="form-item">
      <label class="form-label">学院</label>
      <div class="form-input-wrapper">
        <input type="text" class="form-input" id="college" placeholder="请输入学院" maxlength="50">
      </div>
    </div>

    <!-- 个人简介 -->
    <div class="form-item">
      <label class="form-label">个人简介</label>
      <textarea class="form-textarea" id="bio" placeholder="介绍一下自己..." style="min-height: 150px;"></textarea>
    </div>
  </div>

  <script src="profile.js"></script>
</body>
</html>
