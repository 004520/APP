<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>步骤3 - 设置密码</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="register.css">
  <link rel="stylesheet" href="register-toast.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 强制显示步骤3 */
    .step-content[data-step="3"] {
      display: block !important;
      animation: slideIn 0.3s ease-out;
    }
    .step-content[data-step="1"],
    .step-content[data-step="2"] {
      display: none !important;
    }
    /* 步骤指示器状态 */
    .step-dot[data-step="1"],
    .step-dot[data-step="2"] {
      background: #2ECC71;
    }
    .step-dot[data-step="3"] {
      background: #2ECC71;
      transform: scale(1.3);
      box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.2);
    }
    .step-line {
      background: #2ECC71;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <!-- 顶部导航 -->
    <div class="header-nav">
      <button class="back-btn" id="backBtn">
        <i class="fas fa-arrow-left"></i>
        <span>返回</span>
      </button>
      <h1 class="nav-title">注册新账户</h1>
    </div>

    <!-- 步骤指示器 -->
    <div class="steps-indicator">
      <div class="step-dot active" data-step="1"></div>
      <div class="step-line"></div>
      <div class="step-dot active" data-step="2"></div>
      <div class="step-line"></div>
      <div class="step-dot active" data-step="3"></div>
    </div>

    <!-- 步骤3：设置密码 -->
    <div class="step-content active" data-step="3">
      <div class="form-section">
        <!-- 设置密码 -->
        <div class="input-group">
          <label class="input-label">
            <i class="fas fa-lock input-icon"></i>
            <span>设置密码</span>
            <span class="required-mark">*</span>
          </label>
          <div class="input-wrapper">
            <input
              type="password"
              id="registerPassword"
              class="input"
              placeholder="请设置密码"
              maxlength="16"
              autocomplete="new-password"
            >
            <button type="button" class="toggle-password" id="toggleRegisterPassword">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="error-msg" id="registerPasswordError"></div>
        </div>

        <!-- 确认密码 -->
        <div class="input-group">
          <label class="input-label">
            <i class="fas fa-lock input-icon"></i>
            <span>确认密码</span>
            <span class="required-mark">*</span>
          </label>
          <div class="input-wrapper">
            <input
              type="password"
              id="confirmPassword"
              class="input"
              placeholder="请再次输入密码"
              maxlength="16"
              autocomplete="new-password"
            >
            <button type="button" class="toggle-password" id="toggleConfirmPassword">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="error-msg" id="confirmPasswordError"></div>
        </div>

        <!-- 密码要求 -->
        <div class="password-requirements">
          <div class="requirement" data-requirement="length">
            <i class="fas fa-circle requirement-icon"></i>
            <span>密码长度不能少于8位</span>
          </div>
          <div class="requirement" data-requirement="letter">
            <i class="fas fa-circle requirement-icon"></i>
            <span>密码必须包含字母</span>
          </div>
          <div class="requirement" data-requirement="number">
            <i class="fas fa-circle requirement-icon"></i>
            <span>密码必须包含数字</span>
          </div>
        </div>

        <!-- 按钮组 -->
        <div class="button-group">
          <button type="button" class="btn btn-secondary" id="step3Back">上一步</button>
          <button type="button" class="btn btn-primary" id="step3Complete">
            <span class="btn-text">完成注册</span>
            <span class="spinner" style="display: none;"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- 底部链接 -->
    <div class="footer-section">
      <p class="register-link">
        已经注册？
        <a href="login.html" class="link link-primary">立即登录</a>
      </p>
    </div>
  </div>
</body>
</html>
