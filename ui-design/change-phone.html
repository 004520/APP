<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>修改手机号 - 校园交换助手</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="change-phone.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@cloudbase/js-sdk@8.10.3/dist/cloudbase.full.js"></script>
  <script src="js/cloudbase-config.js"></script>
  <script src="js/cloudbase.js"></script>
</head>
<body>
  <!-- 顶部导航栏 -->
  <div class="page-header">
    <button class="btn-back" onclick="window.location.href='settings.html'">
      <i class="fas fa-arrow-left"></i>
    </button>
    <h1 class="page-title">修改手机号</h1>
  </div>

  <!-- 修改手机号表单 -->
  <div class="change-phone-section">
    <!-- 步骤指示 -->
    <div class="step-indicator">
      <div class="step-item active" data-step="1">
        <div class="step-number">1</div>
        <div class="step-label">验证原手机号</div>
      </div>
      <div class="step-line"></div>
      <div class="step-item" data-step="2">
        <div class="step-number">2</div>
        <div class="step-label">绑定新手机号</div>
      </div>
    </div>

    <form id="changePhoneForm">
      <!-- 步骤1: 验证原手机号 -->
      <div class="form-step step-1" data-step="1">
        <div class="current-phone-info">
          <i class="fas fa-mobile-alt"></i>
          <span>当前绑定手机号: 138****5678</span>
        </div>

        <div class="form-item">
          <label class="form-label">验证码 <span class="required">*</span></label>
          <div class="input-wrapper">
            <input type="text" class="input" id="verifyCode1" placeholder="请输入验证码" maxlength="6" required>
            <button type="button" class="btn-send-code" id="sendCodeBtn1" onclick="sendVerifyCode(1)">
              获取验证码
            </button>
          </div>
          <div class="error-msg" id="verifyCode1Error"></div>
        </div>

        <button type="button" class="btn btn-primary" onclick="verifyOldPhone()">
          <span class="btn-text">下一步</span>
        </button>
      </div>

      <!-- 步骤2: 绑定新手机号 -->
      <div class="form-step step-2" data-step="2" style="display: none;">
        <div class="form-item">
          <label class="form-label">新手机号 <span class="required">*</span></label>
          <div class="input-wrapper">
            <input type="tel" class="input" id="newPhone" placeholder="请输入新手机号" maxlength="11" required>
          </div>
          <div class="error-msg" id="newPhoneError"></div>
        </div>

        <div class="form-item">
          <label class="form-label">验证码 <span class="required">*</span></label>
          <div class="input-wrapper">
            <input type="text" class="input" id="verifyCode2" placeholder="请输入验证码" maxlength="6" required>
            <button type="button" class="btn-send-code" id="sendCodeBtn2" onclick="sendVerifyCode(2)">
              获取验证码
            </button>
          </div>
          <div class="error-msg" id="verifyCode2Error"></div>
        </div>

        <button type="button" class="btn btn-primary" onclick="bindNewPhone()">
          <span class="btn-text">确认修改</span>
        </button>
      </div>
    </form>
  </div>

  <script src="change-phone.js"></script>
</body>
</html>
